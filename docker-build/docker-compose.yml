services:
  postgres:
    image: postgres:16-alpine
    container_name: musicdb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: music-db
      POSTGRES_USER: rrezahatam
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - musicdb_data:/var/lib/postgresql/data
      - ./scripts:/docker-entrypoint-initdb.d

volumes:
  musicdb_data: